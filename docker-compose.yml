services:
  drollery:
    build:
      context: .
      args:
        WITH_TESSERACT: "0"   # set to "1" to bake Tesseract OCR into the image
    restart: unless-stopped
    ports:
      - "${DROLLERY_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      DROLLERY_DATA: /data
    volumes:
      - drollery-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach an Ollama/whisper server running on the Docker host

volumes:
  drollery-data:
