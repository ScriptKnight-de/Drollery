services:
  drollery:
    # `docker compose up -d` pulls this ready-made image (linux/amd64 and linux/arm64); `docker compose up -d --build`
    # builds it from this folder instead. DROLLERY_IMAGE in .env pins a version, e.g. ghcr.io/scriptknight-de/drollery:0.2.3
    image: ${DROLLERY_IMAGE:-ghcr.io/scriptknight-de/drollery:latest}
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${DROLLERY_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      DROLLERY_DATA: /data
    volumes:
      - drollery-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach an Ollama/whisper server running on the Docker host

  # ---- Optional local speech-to-text: Whisper "small", int8 on CPU (Speaches / faster-whisper) --------------
  # Off by default. Turn it on by putting COMPOSE_PROFILES=whisper in .env, then `docker compose up -d`.
  # It is not published to the host: Drollery reaches it inside the stack at http://whisper:8000/v1
  # (Settings > AI models > "Whisper server" preset, model name must match WHISPER_MODEL below).
  # One-shot, runs first: the Whisper server runs as the unprivileged user "ubuntu" (uid 1000) and must be able to write
  # to the model volume. A volume that already holds root-owned files (made by an older setup or by another tool) would
  # make every model download fail with "Permission denied". This hands such files to uid 1000; it changes nothing when
  # the ownership is already right.
  whisper-permissions:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    profiles: ["whisper"]
    restart: "no"
    user: root
    entrypoint: ["sh", "-c", "find /models ! -user 1000 -exec chown 1000:1000 {} + ; chmod u+rwx /models"]
    volumes:
      - whisper-models:/models

  whisper:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    profiles: ["whisper"]
    restart: unless-stopped
    depends_on:
      whisper-permissions:
        condition: service_completed_successfully
    environment:
      ENABLE_UI: "false"                                  # no demo web UI, the API is all Drollery needs
      LOG_LEVEL: info
      WHISPER__COMPUTE_TYPE: int8                         # quantized: roughly 4x lighter and faster than float32 on CPU
      WHISPER__TTL: "600"                                 # unload the model after 10 idle minutes to give the RAM back
      WHISPER__CPU_THREADS: "${WHISPER_CPU_THREADS:-0}"   # 0 = let the library decide
    volumes:
      - whisper-models:/home/ubuntu/.cache/huggingface/hub   # downloaded models survive rebuilds
    cpus: "${WHISPER_CPUS:-4}"                            # cap, so a transcription never starves the rest of the machine
    mem_limit: "${WHISPER_MEM_LIMIT:-3g}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  # One-shot helper: downloads the model on first start (and is a no-op afterwards), then exits.
  # When it fails it says why: the HTTP code, what the Whisper server answered, and what usually causes that. The real
  # reason is always in the server's own log: docker compose logs whisper
  whisper-model:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    profiles: ["whisper"]
    restart: "no"
    depends_on:
      whisper:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        model='${WHISPER_MODEL:-Systran/faster-whisper-small}'
        url="http://whisper:8000/v1/models/$$model"
        echo "Downloading the Whisper model $$model (the first time this can take several minutes) ..."
        attempt=1
        while :; do
          code=$$(curl -sS -o /tmp/answer --max-time 3600 -w '%{http_code}' -X POST "$$url" 2>/tmp/curl-error) || code=000
          case "$$code" in
            5??|000)
              if [ "$$attempt" -lt 3 ]; then
                echo "Attempt $$attempt failed (HTTP $$code), trying again in 5 seconds ..."
                attempt=$$((attempt + 1))
                sleep 5
                continue
              fi ;;
          esac
          break
        done
        if [ "$$code" = 200 ]; then
          cat /tmp/answer
          echo
          exit 0
        fi
        echo "ERROR: could not download the Whisper model '$$model' (HTTP $$code)."
        if [ "$$code" = 000 ]; then
          echo "Could not reach the Whisper server at http://whisper:8000: $$(cat /tmp/curl-error)"
        else
          echo "The Whisper server answered: $$(head -c 500 /tmp/answer)"
        fi
        case "$$code" in
          000) echo "Is the 'whisper' container running and healthy? Check: docker compose ps" ;;
          404) echo "That model does not exist. Check WHISPER_MODEL in .env (for example Systran/faster-whisper-small)." ;;
          5??) echo "The Whisper server could not fetch the model. Two usual reasons: it cannot reach huggingface.co (no internet,"
               echo "or DNS, firewall or proxy settings), or it cannot write to the model volume (\"Permission denied\", or a full disk)."
               echo "The exact reason is in the server's log: docker compose logs whisper" ;;
          *)   echo "See the server's log: docker compose logs whisper" ;;
        esac
        exit 1

volumes:
  drollery-data:
  whisper-models:
