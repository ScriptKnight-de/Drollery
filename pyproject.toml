[project]
name = "drollery"
version = "0.1.0"
description = "Self-hosted library for memes and funny video/audio clips, with pluggable AI tagging, transcription and full-text search."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "yt-dlp",
  "gallery-dl",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
drollery = ["templates/*", "static/*", "config.default.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
