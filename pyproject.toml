[project]
name = "drollery"
version = "0.1.3"
description = "Self-hosted library for memes and funny video/audio clips, with pluggable AI tagging, transcription and full-text search."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ScriptKnight" }]
keywords = ["self-hosted", "memes", "media-library", "fastapi", "htmx", "sqlite", "fts5", "whisper"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "yt-dlp",
  "gallery-dl",
  "segno>=1.6",
]

[project.urls]
Repository = "https://forgejo.scriptknight.de/scriptknight/drollery"
Issues = "https://forgejo.scriptknight.de/scriptknight/drollery/issues"
Changelog = "https://forgejo.scriptknight.de/scriptknight/drollery/src/branch/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
drollery = ["templates/*", "templates/doodles/*", "templates/flags/*", "static/*", "config.default.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
