{% extends "base.html" %}
{% block content %}
<form class="card narrow" method="post" action="/login">
  <h1>Sign in</h1>
  {% if error %}<p class="err">That token is not valid.</p>{% endif %}
  <label>Access token <input type="password" name="token" autofocus required></label>
  <button>Sign in</button>
</form>
{% endblock %}
