{% extends "base.html" %}
{% block title %}Two-factor code · Drollery{% endblock %}
{% block content %}
<div class="login-wrap">
<form class="panel login" method="post" action="/login/2fa">
  <h1>One more step</h1>
  <p class="muted">Enter the 6-digit code from your authenticator app, or one of your backup codes</p>
  {% if error %}<p class="note error" role="alert">{{ error }}</p>{% endif %}
  <label>Code <input name="code" inputmode="numeric" autocomplete="one-time-code" autofocus required></label>
  <button class="btn primary" type="submit">Verify</button>
  <a class="muted small" href="/login">Start over</a>
</form>
</div>
{% endblock %}
